services:
  grafana-lgtm:
    container_name: 'observability'
    image: 'grafana/otel-lgtm:latest'
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  postgres:
    container_name: 'appointments-database'
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  wiremock:
    container_name: 'external-services'
    image: 'wiremock/wiremock:latest'
    command: ['--global-response-templating', '--verbose']
    volumes:
      - './wiremock/mappings:/home/wiremock/mappings'
    ports:
      - '8081:8080'
  greenmail:
    container_name: 'email-server'
    image: 'greenmail/standalone:latest'
    environment:
      - 'GREENMAIL_OPTS=-Dgreenmail.setup.test.smtp -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose'
    ports:
      - '3025:3025'
      - '8082:8080'
  kafka:
    container_name: 'kafka'
    image: 'apache/kafka:latest'
    ports:
      - '9092:9092'
    environment:
      - 'KAFKA_NODE_ID=1'
      - 'KAFKA_PROCESS_ROLES=broker,controller'
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092'
      - 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER'
      - 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093'
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      - 'KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT'
      - 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1'
