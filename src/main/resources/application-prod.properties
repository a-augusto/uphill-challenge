# Active only with -Dspring-boot.run.profiles=prod (or SPRING_PROFILES_ACTIVE=prod).
# JSON console logs, one log aggregators actually expect - the human-readable
# default pattern in application.properties stays for local/dev. Elastic
# Common Schema chosen over GELF/Logstash: a widely-adopted, vendor-neutral
# schema, not tied to a specific backend (Graylog, ELK) the way the others are.
logging.structured.format.console=ecs
