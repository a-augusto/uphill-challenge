spring.application.name=appointments

# Custom Banner
spring.banner.location=classpath:banner.txt

# External room-reservation system - WireMock stub in local/dev, overridden
# per environment to point at the real system in production. Called
# synchronously during booking (a room must be secured for the appointment
# to be valid), unlike the doctor-calendar update below.
app.integrations.room-reservation.base-url=http://localhost:8081
# Fail fast rather than block the request thread on a hanging (not just
# erroring) external system — matches the fail-fast philosophy already
# applied to Kafka below.
app.integrations.room-reservation.connect-timeout-ms=2000
app.integrations.room-reservation.read-timeout-ms=3000

# Doctor-calendar sync is fire-and-forget via Kafka, not a REST call - no
# response needed, so no correctness reason to gate booking on it. A short
# max.block.ms matters here specifically: this call happens synchronously
# within the after-commit listener (still on the request thread, just after
# commit), so an unreachable broker should fail fast (logged, ignored) rather
# than hold the HTTP response hostage to Kafka's 60s default.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=2000
# The topic is declared eagerly at startup (KafkaTopicConfig/NewTopic) so a
# real broker doesn't need auto-creation on first send - but that means
# KafkaAdmin itself must also fail fast against an unreachable broker,
# otherwise app/test startup blocks on its default ~30s request timeout.
spring.kafka.admin.properties.request.timeout.ms=3000
spring.kafka.admin.properties.default.api.timeout.ms=3000
app.kafka.doctor-calendar-topic=doctor-calendar-updates

# Email - points at the GreenMail fake SMTP container locally; overridden per
# environment to point at the real relay/SES/SendGrid SMTP endpoint in production.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.properties.mail.smtp.auth=false
app.mail.from=appointments@uphill.health

# Observability - grafana/otel-lgtm (docker-compose) bundles an OTel collector
# (OTLP on 4317/4318) + Tempo + Prometheus/Mimir + Loki + Grafana (UI on 3000).
# spring-boot-docker-compose has no built-in connection-details support for
# this image, so - same as every other integration in this file - the
# endpoints are explicit rather than auto-discovered.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:4318/v1/logs
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
# 100% sampling for local/dev visibility - the Boot default (10%) is fine for
# prod but means most requests never show up in Tempo during a demo.
management.tracing.sampling.probability=1.0
management.endpoints.web.exposure.include=health,info,metrics
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.opentelemetry.resource-attributes.deployment.environment=local
